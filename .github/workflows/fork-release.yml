name: Fork release

# Manual only. Build and validate first; publication is a separate privileged job.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version already committed in package.json (X.Y.Z)"
        type: string
        required: true
      expected-sha:
        description: "Full audited default-branch commit SHA; its push CI must be green"
        type: string
        required: true
      dry-run:
        description: "Build and retain package/provenance without publishing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  EXPECTED_SHA: ${{ inputs.expected-sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    if: >-
      github.repository == 'alexalok/opencodex' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release contract tests
        run: python3 .github/scripts/test_fork_release.py -v

      - name: Check source, version, tag and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fork_release.py preflight "$RELEASE_VERSION" "$EXPECTED_SHA"

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install frozen dependencies with release-age checks
        run: |
          bun install --frozen-lockfile --minimum-release-age 777600
          (cd gui && bun install --frozen-lockfile --minimum-release-age 777600)
          # Repair placeholder launchers only from the installed pinned binary.
          # Never rerun Bun's installer, which has npm/direct-download fallbacks.
          python3 .github/scripts/fork_release.py init-bun

      - name: Validate source
        run: |
          bun run typecheck
          bun run privacy:scan
          bun run structure:check
          bun run audit:high

      - name: Build and pack
        run: |
          (cd gui && bun run build)
          bun run prepare:package
          git diff --exit-code -- package.json bun.lock gui/bun.lock src bin
          mkdir release-assets
          bun pm pack --filename "release-assets/opencodex-${RELEASE_VERSION}-alexalok.tgz" --quiet
          python3 .github/scripts/fork_release.py package release-assets "$RELEASE_VERSION" "$EXPECTED_SHA"
          python3 .github/scripts/fork_release.py verify release-assets "$RELEASE_VERSION" "$EXPECTED_SHA"

      - name: Retain verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted publishing code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      # This job never installs dependencies or executes anything from the bundle.
      # Recheck source/CI and asset hashes before making a complete draft public.
      - name: Publish fork package and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fork_release.py publish release-assets "$RELEASE_VERSION" "$EXPECTED_SHA"
